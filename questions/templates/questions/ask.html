{% extends 'core/base.html' %}

{% block title %}New Question{% endblock %}

{% block content %}
<h1 class="h3 fw-bold mb-4">New Question</h1>

<form action="{% url 'questions:ask' %}" method="post" class="form-card">
  {% csrf_token %}
  <div class="row mb-3 align-items-baseline">
    <label for="questionTitle" class="col-sm-3 col-form-label form-label-bold">Title</label>
    <div class="col-sm-9">
      <input type="text" class="form-control form-control-ask" id="questionTitle" name="title" maxlength="120" placeholder="Как настроить базовую маршрутизацию и отображение шаблонов?" required>
      <div class="form-text text-muted">Максимальная длина заголовка — 120 символов.</div>
    </div>
  </div>

  <div class="row mb-3 align-items-start">
    <label for="questionBody" class="col-sm-3 col-form-label form-label-bold">Text</label>
    <div class="col-sm-9">
      <textarea class="form-control form-control-ask" id="questionBody" name="text" rows="8" placeholder="Подробно опишите суть вашего вопроса и шаги для воспроизведения проблемы..." required></textarea>
      <div class="form-text text-muted">Опишите подробно суть вашей проблемы и контекст ситуации.</div>
    </div>
  </div>

  <div class="row mb-4 align-items-baseline">
    <label for="questionTags" class="col-sm-3 col-form-label form-label-bold">Tags</label>
    <div class="col-sm-9">
      <input type="text" class="form-control form-control-ask" id="questionTags" name="tags" placeholder="web, python, backend">
      <div class="form-text text-muted">Введите через запятую не более 3 тегов.</div>
    </div>
  </div>

  <div class="row">
    <div class="col-sm-9 offset-sm-3">
      <button type="submit" class="btn btn-ask-dark px-4 py-2">ASK!</button>
    </div>
  </div>
</form>
{% endblock %}
