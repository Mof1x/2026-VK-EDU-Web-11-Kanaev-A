{% extends 'core/base.html' %}
{% block title %}Новый вопрос{% endblock %}
{% block content %}
<h1 class="h3 fw-bold mb-3">Новый вопрос</h1>
<form action="{% url 'questions:ask' %}" method="post" class="form-card">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    {% include 'core/includes/form_field.html' with field=field only %}
  {% endfor %}
  <button type="submit" class="btn btn-ask-dark">Опубликовать вопрос</button>
</form>
{% endblock %}
