{% extends 'core/base.html' %}

{% block title %}Log In{% endblock %}

{% block content %}
<h1 class="h3 fw-bold mb-3">Log In</h1>

<div class="ask-alert-danger" role="alert">
  Вы ввели неправильный логин или пароль
</div>

<form action="{% url 'core:login' %}" method="post" class="form-card">
  {% csrf_token %}
  <div class="row mb-3 align-items-baseline">
    <label for="userLogin" class="col-sm-3 col-form-label form-label-bold">Login</label>
    <div class="col-sm-9">
      <input type="text" class="form-control form-control-ask" id="userLogin" name="login" placeholder="Введите ваш логин" required autofocus>
    </div>
  </div>

  <div class="row mb-3 align-items-baseline">
    <label for="userPassword" class="col-sm-3 col-form-label form-label-bold">Password</label>
    <div class="col-sm-9">
      <input type="password" class="form-control form-control-ask" id="userPassword" name="password" placeholder="********" required>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-sm-9 offset-sm-3">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember_me">
        <label class="form-check-label" for="rememberMe">Запомнить меня на этом компьютере</label>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-sm-9 offset-sm-3">
      <button type="submit" class="btn btn-ask-dark px-4 py-2 mb-3">Log in!</button>
      <div>
        <a href="{% url 'core:signup' %}" class="text-primary text-decoration-underline">create new account</a>
      </div>
    </div>
  </div>
</form>
{% endblock %}
