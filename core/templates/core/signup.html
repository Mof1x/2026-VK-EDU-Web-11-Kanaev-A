{% extends 'core/base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1 class="h3 fw-bold mb-3">Регистрация</h1>
<form action="{% url 'core:signup' %}" method="post" class="form-card">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    {% include 'core/includes/form_field.html' with field=field only %}
  {% endfor %}
  <button type="submit" class="btn btn-ask-dark">Зарегистрироваться</button>
  <a href="{% url 'core:login' %}" class="ms-2">Войти</a>
</form>
{% endblock %}
