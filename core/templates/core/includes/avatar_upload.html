{% load static %}
<div class="row mb-4 align-items-center">
  <label for="{{ input_id }}" class="col-sm-3 col-form-label form-label-bold">Загрузить аватар</label>
  <div class="col-sm-9">
    <div class="d-flex align-items-center gap-3">
      <img src="{% static avatar_path %}" alt="{{ avatar_alt }}" id="avatarPreview" class="avatar-preview-box mb-0">
      <div class="flex-grow-1">
        <input class="form-control form-control-ask" type="file" id="{{ input_id }}" name="avatar" accept="image/*">
        <div class="form-text text-muted">{{ help_text }}</div>
      </div>
    </div>
  </div>
</div>
