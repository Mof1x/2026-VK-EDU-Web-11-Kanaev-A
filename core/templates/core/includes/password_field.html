<div class="row mb-3 align-items-baseline">
  <label for="{{ input_id }}" class="col-sm-3 col-form-label form-label-bold">{{ label }}</label>
  <div class="col-sm-9">
    <input type="password" class="form-control form-control-ask" id="{{ input_id }}" name="{{ input_name }}" placeholder="********"{% if min_length %} minlength="{{ min_length }}"{% endif %} required>
    {% if help_text %}
      <div class="form-text text-muted">{{ help_text }}</div>
    {% endif %}
  </div>
</div>
