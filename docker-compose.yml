services:
  web:
    build: .
    env_file: .env.docker
    environment:
      DJANGO_IN_DOCKER: "1"
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - media:/app/media
      - static:/app/static
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.30.7-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
      - static:/srv/static:ro

  db:
    image: postgres:17-alpine
    env_file: .env.docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  media:
  static:
  postgres_data:
